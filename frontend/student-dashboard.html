<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student dashboard | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="shell"></div><script src="/js/app.js"></script><script>requireRole('student').then(async user=>{if(!user)return;document.querySelector('#shell').innerHTML=`${side('Overview')}<main class="main"><div class="page-header"><div><div class="eyebrow">Student workspace</div><h1>Good morning, ${user.name.split(' ')[0]}.</h1><p class="muted">Keep an eye on your campus concerns.</p></div><a class="btn" href="/submit-complaint.html">+ New complaint</a></div><div class="stat-grid" id="stats"></div><section class="panel"><div class="page-header"><h2>Recent complaints</h2><a href="/complaints.html" style="color:var(--teal);font-weight:700">View all</a></div><div id="recent"></div></section></main>`;const complaints=await api('/complaints');const counts={Pending:0,'Under Review':0,'In Progress':0,Resolved:0};complaints.forEach(c=>counts[c.status]!==undefined&&counts[c.status]++);stats.innerHTML=[['Total complaints',complaints.length,'teal'],['Pending',counts.Pending,'gold'],['In progress',counts['In Progress'],'coral'],['Resolved',counts.Resolved,'green']].map(x=>`<div class="stat ${x[2]}"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');recent.innerHTML=complaints.length?`<div class="table-wrap"><table class="data-table"><tr><th>Complaint</th><th>Category</th><th>Due date</th><th>Status</th><th></th></tr>${complaints.slice(0,5).map(c=>`<tr><td><strong>${c.title}</strong><br><small class="muted">#CC-${String(c.id).padStart(5,'0')}</small></td><td>${c.category}</td><td>${c.due_date ? new Date(c.due_date + 'T00:00:00').toLocaleDateString() : '—'}</td><td>${statusBadge(c.status)}</td><td><a href="/complaint-details.html?id=${c.id}" style="color:var(--teal);font-weight:700">Open</a></td></tr>`).join('')}</table></div>`:'<div class="empty">No complaints yet. Your first submission starts here.</div>'}).catch(()=>{});</script></body></html>
