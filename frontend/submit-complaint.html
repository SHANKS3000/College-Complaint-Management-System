<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Submit complaint | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="shell"></div><script src="/js/app.js"></script><script>requireRole('student').then(user=>{if(!user)return;document.querySelector('#shell').innerHTML=`${side('Submit complaint')}<main class="main"><div class="eyebrow">Student workspace</div><h1>Submit a complaint</h1><p class="muted">Give the review team enough detail to understand and act.</p><div id="message" class="message"></div><section class="panel" style="max-width:760px;margin-top:25px"><form id="complaint-form" enctype="multipart/form-data"><div class="form-grid"><div class="field"><label>Category<select name="category" required><option value="">Select category</option>${['Academic','Faculty','Infrastructure','Hostel','Library','Laboratory','Transport','Canteen','Examination','Fees','IT/Technical','Other'].map(x=>`<option>${x}</option>`).join('')}</select></label></div><div class="field"><label>Assigned department<input name="assignedDepartment" placeholder="Optional"></label></div><div class="field full"><label>Complaint title<input name="title" maxlength="180" required placeholder="Summarize the issue"></label></div><div class="field full"><label>Detailed description<textarea name="description" required placeholder="What happened? Include dates, locations, and impact."></textarea></label></div><div class="field full"><label>Attachment <span class="muted">(JPG, PNG, or PDF up to 5 MB)</span><input name="attachment" type="file" accept="image/jpeg,image/png,application/pdf"></label></div></div><button class="btn" style="margin-top:22px">Submit complaint</button></form></section></main>`;document.querySelector('#complaint-form').addEventListener('submit',async e=>{e.preventDefault();try{const result=await api('/complaints',{method:'POST',body:new FormData(e.target)});alert(`Complaint submitted. Your ID is CC-${String(result.id).padStart(5,'0')}`);location.href='/complaints.html'}catch(error){showMessage(error.message)}})});</script></body></html>
