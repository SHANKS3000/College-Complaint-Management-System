<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint details | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="shell"></div><script src="/js/app.js"></script><script>requireRole('student').then(async user=>{if(!user)return;const id=new URLSearchParams(location.search).get('id');const data=await api('/complaints/'+id);const c=data.complaint;const overdue = isComplaintOverdue(c);
document.querySelector('#shell').innerHTML=`${side('My complaints')}<main class="main"><a href="/complaints.html" style="color:var(--teal);font-weight:700">← All complaints</a>${overdue ? '<div class="message" style="display:block; margin:18px 0; background:#fff4f1; border:1px solid #d66161; color:#7a1d18;">This complaint missed its due date and still requires a response.</div>' : ''}<div class="page-header" style="margin-top:22px"><div><div class="eyebrow">Complaint #CC-${String(c.id).padStart(5,'0')}</div><h1>${c.title}</h1><p class="muted">${c.category} · submitted ${new Date(c.created_at).toLocaleString()}</p></div>${statusBadge(c.status)}</div><div class="detail-grid"><section class="panel"><h2>Complaint details</h2><p style="white-space:pre-wrap;line-height:1.7">${c.description}</p><h3 style="margin-top:35px">Progress history</h3><div class="timeline">${data.updates.length?data.updates.map(u=>`<div class="event"><strong>${u.new_status}</strong><br><small>${new Date(u.created_at).toLocaleString()} · ${u.admin_name}</small><p class="muted">${u.remarks||'Status updated.'}</p></div>`).join(''):'<div class="event"><strong>Pending</strong><p class="muted">Your complaint has been submitted.</p></div>'}</div></section><aside class="panel"><h3>Routing</h3><p class="muted">Assigned department</p><strong>${c.assigned_department||'To be assigned'}</strong><p class="muted" style="margin-top:20px">Due date</p><strong>${c.due_date ? new Date(c.due_date + 'T00:00:00').toLocaleDateString() : 'Not set'}</strong><p class="muted" style="margin-top:25px">Latest staff remark</p><p>${c.admin_remarks||'No remarks yet.'}</p></aside></div></main>`}).catch(error=>alert(error.message));</script></body></html>
