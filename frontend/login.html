<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student login | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Student portal</div><h1>Welcome back</h1><p class="muted">Sign in to submit and track your complaints.</p><div id="message" class="message"></div><form id="login-form"><div class="field"><label for="email">College email</label><input id="email" type="email" required></div><div class="field" style="margin-top:16px"><label for="password">Password</label><input id="password" type="password" required></div><button class="btn" style="width:100%;margin-top:23px">Sign in</button></form><p class="muted">New here? <a style="color:var(--teal);font-weight:700" href="/register.html">Create an account</a></p></section></main><script src="/js/app.js"></script><script>document.querySelector('#nav').innerHTML=nav();document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,role:'student'})});location.href='/student-dashboard.html'}catch(error){showMessage(error.message)}})</script></body></html>
