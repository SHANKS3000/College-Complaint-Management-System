<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff login | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Staff portal</div><h1>Administrator sign in</h1><p class="muted">Manage campus concerns from one place.</p><div id="message" class="message"></div><form id="login-form"><div class="field"><label>Email<input id="email" type="email" required></label></div><div class="field" style="margin-top:16px"><label>Password<input id="password" type="password" required></label></div><button class="btn" style="width:100%;margin-top:23px">Open dashboard</button></form></section></main><script src="/js/app.js"></script><script>document.querySelector('#nav').innerHTML=nav();document.querySelector('#login-form').addEventListener('submit',async e=>{e.preventDefault();try{await api('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value,role:'admin'})});location.href='/admin-dashboard.html'}catch(error){showMessage(error.message)}})</script></body></html>
