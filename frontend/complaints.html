<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My complaints | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="shell"></div><script src="/js/app.js"></script><script>requireRole('student').then(async user=>{if(!user)return;document.querySelector('#shell').innerHTML=`${side('My complaints')}<main class="main"><div class="eyebrow">Student workspace</div><h1>My complaints</h1><p class="muted">A complete record of everything you have reported.</p><section class="table-wrap" style="margin-top:26px"><div id="list"></div></section></main>`;const rows=await api('/complaints');list.innerHTML=rows.length?`<table class="data-table"><tr><th>ID / complaint</th><th>Category</th><th>Submitted</th><th>Due date</th><th>Status</th><th></th></tr>${rows.map(c=>`<tr><td><strong>#CC-${String(c.id).padStart(5,'0')}</strong><br>${c.title}</td><td>${c.category}</td><td>${new Date(c.created_at).toLocaleDateString()}</td><td>${c.due_date ? new Date(c.due_date + 'T00:00:00').toLocaleDateString() : '—'}</td><td>${statusBadge(c.status)}</td><td><a href="/complaint-details.html?id=${c.id}" style="color:var(--teal);font-weight:700">Details</a></td></tr>`).join('')}</table>`:'<div class="empty">No complaints submitted yet.</div>'}).catch(()=>{});</script></body></html>
