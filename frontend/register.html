<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register | Campus Care</title><link rel="stylesheet" href="/css/style.css"></head><body><div id="nav"></div><main class="auth-wrap"><section class="auth-card"><div class="eyebrow">Student portal</div><h1>Create your account</h1><p class="muted">Use your college details to get started.</p><div id="message" class="message"></div><form id="register-form"><div class="form-grid"><div class="field"><label>Student ID<input name="studentId" required></label></div><div class="field"><label>Full name<input name="name" required></label></div><div class="field"><label>Email<input name="email" type="email" required></label></div><div class="field"><label>Phone<input name="phone" type="tel"></label></div><div class="field"><label>Department<input name="department" required></label></div><div class="field"><label>Year<select name="year" required><option value="">Select</option><option>1</option><option>2</option><option>3</option><option>4</option></select></label></div><div class="field full"><label>Password<input name="password" type="password" minlength="6" required></label></div></div><button class="btn" style="width:100%;margin-top:23px">Create account</button></form><p class="muted">Already registered? <a style="color:var(--teal);font-weight:700" href="/login.html">Sign in</a></p></section></main><script src="/js/app.js"></script><script>document.querySelector('#nav').innerHTML=nav();document.querySelector('#register-form').addEventListener('submit',async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));try{await api('/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});location.href='/student-dashboard.html'}catch(error){showMessage(error.message)}})</script></body></html>
